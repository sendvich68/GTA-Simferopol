plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simferopol.gta'
    compileSdk 34

    defaultConfig {
        applicationId "com.simferopol.gta"
        minSdk 24 // Sceneform требует минимум 24
        targetSdk 34
        versionCode 3
        versionName "1.2-3D"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    // Библиотеки для 3D-графики и анимаций
    implementation 'com.google.ar.sceneform:core:1.17.1'
    implementation 'com.google.ar.sceneform:assets:1.17.1'
}
